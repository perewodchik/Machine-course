<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курсы машинного обучения</title>
  <style>
    :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #1f2328; --muted: #57606a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #e6e6e6; --muted: #a0a7b0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; padding: 2rem 1rem; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.75rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Курсы машинного обучения</h1>
    <p>Сайт готовится. Скоро здесь появятся интерактивные курсы: математика для&nbsp;машинного обучения и&nbsp;восемь курсов ML.</p>
  </main>
</body>
</html>
