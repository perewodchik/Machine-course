[project]
name = "mlf"
version = "0.1.0"
description = "Python-часть курса «Математика для ML»: сниппеты уроков, проверки упражнений, численная проверка формул"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "jupytext>=1.16", "nbmake>=1.5", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mlf"]
