# Глоссарий RU ↔ EN. Русский термин — основной; английский показывается на полях при первом появлении.
# Тексты в одинарных кавычках: так YAML не трогает обратные слеши и двоеточия.
- id: eigenvector
  ru: 'собственный вектор'
  en: 'eigenvector'
- id: normal-equations
  ru: 'нормальные уравнения'
  en: 'normal equations'
  note: 'Не про нормальное распределение: вектор остатков нормален (перпендикулярен) столбцам X.'
- id: psd
  ru: 'положительно полуопределённая (неотрицательно определённая) матрица'
  en: 'positive semidefinite (PSD) matrix'
- id: likelihood
  ru: 'правдоподобие'
  en: 'likelihood'
- id: chain-rule-probability
  ru: 'формула умножения вероятностей'
  en: 'chain rule of probability'
  note: 'Не путать с правилом цепочки для производных (chain rule).'
- id: residual
  ru: 'остаток'
  en: 'residual'
  note: 'Разница ответа и предсказания на объекте при выбранных весах; в модели шума CS229 — error term ε⁽ⁱ⁾.'
- id: least-squares
  ru: 'метод наименьших квадратов (МНК)'
  en: 'least squares'
- id: column-space
  ru: 'пространство столбцов'
  en: 'column space (range)'
- id: log-likelihood
  ru: 'логарифм правдоподобия'
  en: 'log-likelihood'
- id: intercept
  ru: 'свободный член'
  en: 'intercept (bias term)'
- id: cost-function
  ru: 'функция потерь'
  en: 'cost function (loss)'
- id: linear-map
  ru: 'линейное отображение'
  en: 'linear map'
- id: image
  ru: 'образ (вектора при отображении)'
  en: 'image'
- id: composition
  ru: 'композиция отображений'
  en: 'composition'
- id: prior
  ru: 'априорная вероятность'
  en: "prior"
- id: posterior
  ru: 'апостериорная вероятность'
  en: "posterior"
- id: base-rate
  ru: 'базовая частота'
  en: "base rate"
- id: total-probability
  ru: 'формула полной вероятности'
  en: "law of total probability"
- id: bayes-rule
  ru: 'формула Байеса'
  en: "Bayes' rule"
- id: lecture-notes
  ru: 'конспект лекций'
  en: 'lecture notes'
  note: 'Основной текст CS229; разделы на полях указаны по названиям, а не по номерам глав.'
- id: model
  ru: 'модель'
  en: 'model, hypothesis'
  note: 'В CS229 модель называют гипотезой (hypothesis).'
- id: set
  ru: 'множество, элемент, подмножество'
  en: 'set, element, subset'
- id: map
  ru: 'отображение (функция)'
  en: 'map, function'
  note: 'Множество, откуда берут аргумент, — область определения (domain); куда попадают значения — codomain; множество всех значений — образ (image, range).'
- id: quantifier
  ru: 'квантор: «для всех», «существует»'
  en: 'quantifier: for all, there exists'
- id: argmin
  ru: 'аргмин, точка минимума'
  en: 'argmin, minimizer'
- id: proportional
  ru: 'пропорционально'
  en: 'proportional to'
- id: summation
  ru: 'знак суммы, знак произведения'
  en: 'summation notation, product notation'
- id: summation-index
  ru: 'индекс суммирования'
  en: 'index of summation (dummy index)'
  note: 'Имя индекса суммирования ни на что не влияет: $\sum_i a_i = \sum_k a_k$.'
- id: indicator
  ru: 'индикатор'
  en: 'indicator function'
  note: 'Обозначение как в CS229: $1\{\cdot\}$. Не путать с вектором из единиц $\mathbf{1}$.'
- id: geometric-series
  ru: 'геометрический ряд'
  en: 'geometric series'
- id: discount-factor
  ru: 'коэффициент дисконтирования'
  en: 'discount factor'
- id: natural-log
  ru: 'натуральный логарифм, экспонента'
  en: 'natural logarithm, exponential'
  note: 'В CS229 и в NumPy (np.log) $\log$ — натуральный логарифм, по основанию $e$.'
- id: sigmoid
  ru: 'сигмоида, логистическая функция'
  en: 'sigmoid, logistic function'
- id: underflow
  ru: 'потеря значимости снизу, исчезновение порядка'
  en: 'underflow'
  note: 'Результат меньше самого маленького числа float64 записывается нулём — без ошибки и предупреждения.'
- id: log-sum-exp
  ru: 'логарифм суммы экспонент'
  en: 'log-sum-exp'
- id: integral
  ru: 'определённый интеграл, первообразная'
  en: 'definite integral, antiderivative'
- id: improper-integral
  ru: 'несобственный интеграл'
  en: 'improper integral'
- id: substitution
  ru: 'замена переменной'
  en: 'substitution, change of variables'
- id: monte-carlo
  ru: 'метод Монте-Карло'
  en: 'Monte Carlo method'
  note: 'Оценка интеграла средним значением функции в случайных точках; ошибка убывает как $1/\sqrt{n}$.'
- id: linear-combination
  ru: 'линейная комбинация, линейная оболочка'
  en: 'linear combination, span'
- id: linear-independence
  ru: 'линейная независимость'
  en: 'linear independence'
- id: basis
  ru: 'базис, размерность, подпространство'
  en: 'basis, dimension, subspace'
- id: dot-product
  ru: 'скалярное произведение'
  en: 'dot product, inner product'
  note: 'В CS229 — $x^\top y$ или $\langle x, y \rangle$; в русских учебниках — $(x, y)$.'
- id: norm
  ru: 'норма; евклидова норма, норма $\ell_1$, норма $\ell_\infty$'
  en: 'norm; Euclidean norm, $\ell_1$ norm, max norm'
- id: frobenius-norm
  ru: 'норма Фробениуса'
  en: 'Frobenius norm'
- id: unit-ball
  ru: 'единичный шар'
  en: 'unit ball'
- id: cauchy-schwarz
  ru: 'неравенство Коши — Буняковского'
  en: 'Cauchy–Schwarz inequality'
  note: 'В англоязычной литературе — по Коши и Шварцу; Буняковский доказал интегральный вариант раньше Шварца.'
- id: orthogonal
  ru: 'ортогональные, перпендикулярные векторы'
  en: 'orthogonal vectors'
- id: vector-projection
  ru: 'проекция на вектор'
  en: 'projection onto a vector'
- id: cosine-similarity
  ru: 'косинусная близость'
  en: 'cosine similarity'
- id: matrix-product
  ru: 'произведение матриц'
  en: 'matrix product, matrix multiplication'
- id: outer-product
  ru: 'внешнее произведение'
  en: 'outer product'
  note: '$x y^\top$ — столбец на строку, матрица ранга 1. Не путать с векторным произведением (*cross product*).'
- id: block-matrix
  ru: 'блочная матрица'
  en: 'block matrix'
- id: hadamard-product
  ru: 'адамарово (поэлементное) произведение'
  en: 'Hadamard product, elementwise product'
  note: 'В NumPy — `A * B`; матричное произведение — `A @ B`.'
- id: gram-matrix
  ru: 'матрица Грама'
  en: 'Gram matrix'
  note: '$X^\top X$ — попарные скалярные произведения столбцов $X$.'
- id: vectorization
  ru: 'векторизация'
  en: 'vectorization'
  note: 'Запись вычисления через операции с матрицами вместо циклов по объектам.'
- id: identity-matrix
  ru: 'единичная матрица'
  en: 'identity matrix'
- id: diagonal-matrix
  ru: 'диагональная матрица'
  en: 'diagonal matrix'
- id: activation
  ru: 'функция активации'
  en: 'activation function'
- id: transpose
  ru: 'транспонирование, транспонированная матрица'
  en: 'transpose'
- id: symmetric-matrix
  ru: 'симметричная, кососимметричная матрица'
  en: 'symmetric, skew-symmetric matrix'
- id: trace
  ru: 'след матрицы'
  en: 'trace'
  note: 'В русских учебниках — также $\operatorname{Sp} A$ (от нем. Spur).'
- id: cyclic-property
  ru: 'циклическая перестановка под следом'
  en: 'cyclic property of the trace'
