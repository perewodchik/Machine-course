# Глоссарий RU ↔ EN. Русский термин — основной; английский показывается на полях при первом появлении.
# Тексты в одинарных кавычках: так YAML не трогает обратные слеши и двоеточия.
- id: eigenvector
  ru: 'собственный вектор'
  en: 'eigenvector'
- id: normal-equations
  ru: 'нормальные уравнения'
  en: 'normal equations'
  note: 'Не про нормальное распределение: вектор остатков нормален (перпендикулярен) столбцам X.'
- id: psd
  ru: 'положительно полуопределённая (неотрицательно определённая) матрица'
  en: 'positive semidefinite (PSD) matrix'
- id: likelihood
  ru: 'правдоподобие'
  en: 'likelihood'
- id: chain-rule-probability
  ru: 'формула умножения вероятностей'
  en: 'chain rule of probability'
  note: 'Не путать с правилом цепочки для производных (chain rule).'
- id: residual
  ru: 'остаток'
  en: 'residual'
  note: 'Разница ответа и предсказания на объекте при выбранных весах; в модели шума CS229 — error term ε⁽ⁱ⁾.'
- id: least-squares
  ru: 'метод наименьших квадратов (МНК)'
  en: 'least squares'
- id: column-space
  ru: 'пространство столбцов'
  en: 'column space (range)'
- id: log-likelihood
  ru: 'логарифм правдоподобия'
  en: 'log-likelihood'
- id: intercept
  ru: 'свободный член'
  en: 'intercept (bias term)'
- id: cost-function
  ru: 'функция потерь'
  en: 'cost function (loss)'
- id: linear-map
  ru: 'линейное отображение'
  en: 'linear map'
- id: image
  ru: 'образ (вектора при отображении)'
  en: 'image'
- id: composition
  ru: 'композиция отображений'
  en: 'composition'
- id: prior
  ru: 'априорная вероятность'
  en: "prior"
- id: posterior
  ru: 'апостериорная вероятность'
  en: "posterior"
- id: base-rate
  ru: 'базовая частота'
  en: "base rate"
- id: total-probability
  ru: 'формула полной вероятности'
  en: "law of total probability"
- id: bayes-rule
  ru: 'формула Байеса'
  en: "Bayes' rule"
- id: lecture-notes
  ru: 'конспект лекций'
  en: 'lecture notes'
  note: 'Основной текст CS229; разделы на полях указаны по названиям, а не по номерам глав.'
- id: model
  ru: 'модель'
  en: 'model, hypothesis'
  note: 'В CS229 модель называют гипотезой (hypothesis).'
- id: set
  ru: 'множество, элемент, подмножество'
  en: 'set, element, subset'
- id: map
  ru: 'отображение (функция)'
  en: 'map, function'
  note: 'Множество, откуда берут аргумент, — область определения (domain); куда попадают значения — codomain; множество всех значений — образ (image, range).'
- id: quantifier
  ru: 'квантор: «для всех», «существует»'
  en: 'quantifier: for all, there exists'
- id: argmin
  ru: 'аргмин, точка минимума'
  en: 'argmin, minimizer'
- id: proportional
  ru: 'пропорционально'
  en: 'proportional to'
- id: summation
  ru: 'знак суммы, знак произведения'
  en: 'summation notation, product notation'
- id: summation-index
  ru: 'индекс суммирования'
  en: 'index of summation (dummy index)'
  note: 'Имя индекса суммирования ни на что не влияет: $\sum_i a_i = \sum_k a_k$.'
- id: indicator
  ru: 'индикатор'
  en: 'indicator function'
  note: 'Обозначение как в CS229: $1\{\cdot\}$. Не путать с вектором из единиц $\mathbf{1}$.'
- id: geometric-series
  ru: 'геометрический ряд'
  en: 'geometric series'
- id: discount-factor
  ru: 'коэффициент дисконтирования'
  en: 'discount factor'
- id: natural-log
  ru: 'натуральный логарифм, экспонента'
  en: 'natural logarithm, exponential'
  note: 'В CS229 и в NumPy (np.log) $\log$ — натуральный логарифм, по основанию $e$.'
- id: sigmoid
  ru: 'сигмоида, логистическая функция'
  en: 'sigmoid, logistic function'
- id: underflow
  ru: 'потеря значимости снизу, исчезновение порядка'
  en: 'underflow'
  note: 'Результат меньше самого маленького числа float64 записывается нулём — без ошибки и предупреждения.'
- id: log-sum-exp
  ru: 'логарифм суммы экспонент'
  en: 'log-sum-exp'
- id: integral
  ru: 'определённый интеграл, первообразная'
  en: 'definite integral, antiderivative'
- id: improper-integral
  ru: 'несобственный интеграл'
  en: 'improper integral'
- id: substitution
  ru: 'замена переменной'
  en: 'substitution, change of variables'
- id: monte-carlo
  ru: 'метод Монте-Карло'
  en: 'Monte Carlo method'
  note: 'Оценка интеграла средним значением функции в случайных точках; ошибка убывает как $1/\sqrt{n}$.'
