# Проекты курсов ML (S7.03): страница /projects/<id>/ — этапы с автопроверкой и рубрика. Ноутбук — notebooks/<notebook>.ipynb.
# Порог метрики задаёт задача проекта, прогнав бейзлайн (docs/implementation/context/ml-courses.md, «Проекты»).
projects:
  - id: demo-apartments
    course: ml-basics
    title: 'Демонстрационный проект: цена квартиры'
    summary: 'Шаблон проектов курсов ML на синтетических «Квартирах»: этапы с автопроверкой, закрытая тестовая выборка и отчёт.'
    notebook: projects/demo_apartments
    minutes: 40
    metric: 'RMSE на закрытой тестовой выборке не больше 1.0 млн ₽'
    stages:
      - { title: 'Данные и разбиение', check: 'тестовая часть закрыта: обращение к ней до финальной оценки — ошибка с объяснением' }
      - { title: 'Бейзлайн', check: 'предсказание средним проверяется на примере' }
      - { title: 'Линейная регрессия с нуля', check: 'скрытые тесты на случайных задачах против numpy.linalg.lstsq' }
      - { title: 'Выбор модели по валидации', check: 'модель лучше бейзлайна; признаки стандартизованы по обучающей части' }
      - { title: 'Финальная оценка', check: 'одна оценка на закрытой выборке, порог метрики' }
    rubric:
      passed: 'все этапы пройдены, метрика на тесте не хуже порога, отчёт по шаблону'
      good: 'плюс честное сравнение нескольких моделей на валидации и анализ ошибок с примерами'
      excellent: 'плюс своя гипотеза, проверенная экспериментом, и выводы о том, когда модель ошибается'
  - id: p1-house-prices
    course: ml-basics
    title: 'Проект P1. Цена квартиры'
    summary: 'Полный цикл регрессии на 21 613 продажах домов в округе Кинг (OpenML 42092, CC0): разбиение по домам, бейзлайн, LMS с нуля, признаки, одна честная оценка на тесте и разбор ошибок по срезам.'
    notebook: projects/p1_house_prices
    minutes: 420
    metric: 'RMSE на закрытой тестовой выборке не больше 160 000 $'
    stages:
      - { title: 'Данные и разбиение', check: 'разбиение по домам: повторные продажи одного дома не расходятся по частям; тест закрыт' }
      - { title: 'Бейзлайн', check: 'стандартизация только по обучающей части (утечка ловится); линейная модель лучше среднего' }
      - { title: 'LMS с нуля', check: 'градиент совпадает с конечными разностями; пакетный спуск приходит к весам lstsq до 10⁻³; мини-батч — в пределах 2 %' }
      - { title: 'Признаки', check: 'RMSE на валидации не больше 85 % RMSE этапа 1; прогноз в долларах, а не в логарифме цены' }
      - { title: 'Оценка и ошибки', check: 'одна оценка на закрытой выборке, порог метрики; RMSE по срезам проверяется на примере' }
    rubric:
      passed: 'все этапы пройдены, RMSE на тесте не больше 160 000 $, отчёт по шаблону'
      good: 'плюс таблица экспериментов на валидации и разбор ошибок по классу постройки и почтовому индексу с примерами домов'
      excellent: 'плюс своя гипотеза (например, расстояние до центра или сезон продажи), проверенная на валидации, и выводы о том, где модель ошибается'
  - id: p2-bank-marketing
    course: ml-basics
    title: 'Проект P2. Отклик на предложение банка'
    summary: 'Кому звонить с предложением вклада: 45 211 звонков банка (Bank Marketing, UCI, CC BY 4.0), откликов 11.7 %. Найти утечку, обучить логистическую регрессию методом Ньютона, выбрать регуляризацию кросс-валидацией, поставить порог по прибыли и откалибровать вероятности.'
    notebook: projects/p2_bank_marketing
    minutes: 540
    metric: 'PR-AUC на закрытой тестовой выборке не меньше 0.35 (у случайной модели — 0.117)'
    stages:
      - { title: 'Данные и утечка', check: 'длительность звонка не в признаках — её нет в момент решения; разбиение стратифицировано' }
      - { title: 'Логистическая регрессия с нуля', check: 'веса метода Ньютона совпадают с LogisticRegression до 10⁻³ при той же регуляризации' }
      - { title: 'Регуляризация и выбор', check: 'L1 или L2 и сила штрафа — по кросс-валидации на обучающей части; PR-AUC на валидации не меньше 0.37' }
      - { title: 'Порог и калибровка', check: 'порог максимизирует прибыль (сверка с перебором на случайных задачах); калибровка Платта не ухудшает Брайер' }
      - { title: 'Финальная оценка', check: 'тест открывается один раз: PR-AUC и прибыль кампании' }
    rubric:
      passed: 'все этапы пройдены, PR-AUC на тесте не меньше 0.35, отчёт по шаблону'
      good: 'плюс объяснение утечки с цифрами, таблица кросс-валидации и экономическое обоснование порога'
      excellent: 'плюс своя гипотеза, проверенная на валидации, и анализ, как прибыль зависит от цены звонка'
