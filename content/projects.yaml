# Проекты курсов ML (S7.03): страница /projects/<id>/ — этапы с автопроверкой и рубрика. Ноутбук — notebooks/<notebook>.ipynb.
# Порог метрики задаёт задача проекта, прогнав бейзлайн (docs/implementation/context/ml-courses.md, «Проекты»).
projects:
  - id: demo-apartments
    course: ml-basics
    title: 'Демонстрационный проект: цена квартиры'
    summary: 'Шаблон проектов курсов ML на синтетических «Квартирах»: этапы с автопроверкой, закрытая тестовая выборка и отчёт.'
    notebook: projects/demo_apartments
    minutes: 40
    metric: 'RMSE на закрытой тестовой выборке не больше 1.0 млн ₽'
    stages:
      - { title: 'Данные и разбиение', check: 'тестовая часть закрыта: обращение к ней до финальной оценки — ошибка с объяснением' }
      - { title: 'Бейзлайн', check: 'предсказание средним проверяется на примере' }
      - { title: 'Линейная регрессия с нуля', check: 'скрытые тесты на случайных задачах против numpy.linalg.lstsq' }
      - { title: 'Выбор модели по валидации', check: 'модель лучше бейзлайна; признаки стандартизованы по обучающей части' }
      - { title: 'Финальная оценка', check: 'одна оценка на закрытой выборке, порог метрики' }
    rubric:
      passed: 'все этапы пройдены, метрика на тесте не хуже порога, отчёт по шаблону'
      good: 'плюс честное сравнение нескольких моделей на валидации и анализ ошибок с примерами'
      excellent: 'плюс своя гипотеза, проверенная экспериментом, и выводы о том, когда модель ошибается'
