# Понятия теории вероятностей. Формат — content/concepts/la.yaml; программа — docs/program/03-probability.md.
# Граф модуля III дополняется вместе с его уроками (этап 4); здесь — то, на что уже ссылаются формулы и уроки.
- id: prob.probability-space
  title:
    ru: 'Вероятностное пространство'
    en: 'probability space'
  summary: 'Пространство исходов $\Omega$, события — его подмножества, вероятность $P$ с аксиомами: $P(A) \ge 0$, $P(\Omega) = 1$, сложение для несовместных; отсюда $P(\bar A) = 1 - P(A)$ и $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.'
  lesson: probability-space
  prerequisites: []
  core: true

- id: prob.random-variable
  title:
    ru: 'Случайная величина и её распределение'
    en: 'random variable; PMF, PDF, CDF'
  summary: 'Функция из $\Omega$ в $\mathbb{R}$; распределение задают функция вероятности $p(x) = P(X = x)$, плотность $p(x)$ с $P(a \le X \le b) = \int_a^b p(x)\,dx$ или функция распределения $F(x) = P(X \le x)$.'
  lesson: random-variables
  prerequisites: [prob.probability-space, calc.integral]
  core: true

- id: prob.expectation
  title:
    ru: 'Матожидание и дисперсия'
    en: 'expectation and variance'
  summary: '$\mathbb{E}X = \sum_x x\,p(x)$ — центр масс; $\mathbb{E}\,g(X) = \sum_x g(x)\,p(x)$ (LOTUS); $\operatorname{Var} X = \mathbb{E}X^2 - (\mathbb{E}X)^2$; для выпуклой $f$ — $f(\mathbb{E}X) \le \mathbb{E}f(X)$ (Йенсен).'
  lesson: expectation-variance
  prerequisites: [prob.random-variable, calc.convexity]
  core: true

- id: prob.discrete-distributions
  title:
    ru: 'Дискретные распределения'
    en: 'discrete distributions'
  summary: 'Бернулли ($\mathbb{E} = \phi$), биномиальное ($n\phi$, $n\phi(1 - \phi)$), геометрическое ($1/\phi$), Пуассона ($\mathbb{E} = \operatorname{Var} = \lambda$), категориальное и мультиномиальное.'
  lesson: discrete-distributions
  prerequisites: [prob.expectation, prob.independence]
  core: true

- id: prob.continuous-distributions
  title:
    ru: 'Непрерывные распределения'
    en: 'continuous distributions'
  summary: 'Равномерное, показательное (без памяти), нормальное $\mathcal{N}(\mu, \sigma^2)$, Лапласа (L1), логистическое (CDF — сигмоида), бета на $[0, 1]$; стандартизация $Z = (X - \mu)/\sigma$ и правило 68–95–99.7.'
  lesson: continuous-distributions
  prerequisites: [prob.random-variable, prob.expectation]
  core: true

- id: prob.limit-theorems
  title:
    ru: 'Предельные теоремы и метод Монте-Карло'
    en: 'limit theorems and Monte Carlo'
  summary: 'Закон больших чисел: выборочное среднее сходится к $\mathbb{E}X$; $\operatorname{Var} \bar X = \sigma^2/n$, ошибка Монте-Карло $\sim \sigma/\sqrt{n}$; ЦПТ: стандартизованная сумма i.i.d. близка к $\mathcal{N}(0, 1)$; оценка объединения $P(\cup A_i) \le \sum P(A_i)$, ★ Хёффдинг.'
  lesson: limit-theorems
  prerequisites: [prob.discrete-distributions, prob.continuous-distributions]
  core: true

- id: prob.joint-distributions
  title:
    ru: 'Совместные распределения и ковариация'
    en: 'joint distributions and covariance'
  summary: 'Совместное $p(x, y)$, маргинальное $p(x) = \sum_y p(x, y)$, условное $p(x \mid y)$; ковариация $\operatorname{Cov}(X, Y) = \mathbb{E}XY - \mathbb{E}X\, \mathbb{E}Y$, корреляция $\lvert \rho \rvert \le 1$; некоррелированность не означает независимость; закон полного матожидания $\mathbb{E}X = \mathbb{E}[\mathbb{E}[X \mid Y]]$.'
  lesson: joint-distributions
  prerequisites: [prob.expectation, prob.limit-theorems]
  core: true

- id: prob.random-vectors
  title:
    ru: 'Случайные векторы и линейные преобразования'
    en: 'random vectors and linear transformations'
  summary: 'Среднее $\mu = \mathbb{E}X$ и ковариационная матрица $\Sigma = \mathbb{E}(X - \mu)(X - \mu)^\top \succeq 0$; $\operatorname{Var}(a^\top X) = a^\top \Sigma a$; $\operatorname{Cov}(AX + b) = A\Sigma A^\top$; плотность $p_Y(y) = p_X(A^{-1}(y - b))\, \lvert \det A \rvert^{-1}$.'
  lesson: random-vectors
  prerequisites: [prob.joint-distributions, la.psd]
  core: true

- id: prob.multivariate-normal
  title:
    ru: 'Многомерное нормальное распределение'
    en: 'multivariate Gaussian'
  summary: 'Плотность $\frac{1}{(2\pi)^{d/2} \lvert \Sigma \rvert^{1/2}} \exp\bigl(-\frac12 (x - \mu)^\top \Sigma^{-1} (x - \mu)\bigr)$ при $\Sigma \succ 0$; линии уровня — эллипсы с осями вдоль собственных векторов $\Sigma$ и полуосями $k\sqrt{\lambda_i}$; расстояние Махаланобиса; выборка $\mu + Lz$, $\Sigma = LL^\top$; маргинальные и условные распределения гауссовы.'
  lesson: multivariate-normal
  prerequisites: [prob.random-vectors, prob.normal, la.eigen]
  core: true

- id: prob.mixtures
  title:
    ru: 'Смеси и скрытые переменные'
    en: 'mixtures and latent variables'
  summary: 'Смесь $p(x) = \sum_k \phi_k\, p(x \mid z = k)$ — маргинализация по скрытой $z$; порождение: сначала $z \sim \phi$, потом $x \mid z$; ответственность $P(z = k \mid x)$ по формуле Байеса; смесь — не сумма величин.'
  lesson: mixtures-latent
  prerequisites: [prob.multivariate-normal, prob.bayes]
  core: true

- id: prob.independence
  title:
    ru: 'Независимость'
    en: 'independence'
  summary: 'События или величины независимы, если совместная вероятность (плотность) равна произведению отдельных.'
  lesson: conditional-independence
  prerequisites: []
  core: true

- id: prob.normal
  title:
    ru: 'Нормальное распределение'
    en: 'normal (Gaussian) distribution'
  summary: 'Плотность $\frac{1}{\sqrt{2\pi}\,\sigma} \exp\bigl(-\frac{(x - \mu)^2}{2\sigma^2}\bigr)$; второй параметр $\mathcal{N}(\mu, \sigma^2)$ — дисперсия.'
  lesson: continuous-distributions
  prerequisites: [calc.log-exp]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / Probabilistic interpretation'

- id: prob.conditional
  title:
    ru: 'Условная вероятность'
    en: 'conditional probability'
  summary: '$P(A \mid B) = P(A \cap B) / P(B)$: вероятность $A$, когда известно, что произошло $B$.'
  lesson: conditional-independence
  prerequisites: []
  core: true

- id: prob.total-probability
  title:
    ru: 'Формула полной вероятности'
    en: 'law of total probability'
  summary: 'Если $B_1, \ldots, B_K$ разбивают пространство исходов, то $P(A) = \sum_k P(A \mid B_k)\, P(B_k)$.'
  lesson: bayes
  prerequisites: [prob.conditional]
  core: true

- id: prob.bayes
  title:
    ru: 'Формула Байеса'
    en: "Bayes' rule"
  summary: '$P(B \mid A) = P(A \mid B)\, P(B) / P(A)$: апостериорная вероятность из априорной и правдоподобия; знаменатель — формула полной вероятности.'
  lesson: bayes
  prerequisites: [prob.conditional, prob.total-probability]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Generative learning algorithms'

