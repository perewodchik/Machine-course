# Понятия анализа и оптимизации. Формат — content/concepts/la.yaml; программа — docs/program/02-calculus.md.
- id: calc.gradient
  title:
    ru: 'Градиент'
    en: 'gradient'
  summary: 'Вектор частных производных той же формы, что аргумент; показывает направление быстрейшего роста.'
  lesson: gradient
  prerequisites: []
  core: true

- id: calc.matrix-calculus
  title:
    ru: 'Матричное дифференцирование'
    en: 'matrix calculus'
  summary: 'Градиенты выражений с векторами и матрицами без покоординатных выкладок: $\nabla_x a^\top x = a$, $\nabla_x x^\top A x = (A + A^\top)x$.'
  lesson: matrix-calculus
  prerequisites: [calc.gradient, la.matmul, la.transpose]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / The normal equations'

- id: calc.hessian
  title:
    ru: 'Гессиан'
    en: 'Hessian'
  summary: 'Симметричная матрица вторых производных $\nabla^2 f$, $H_{ij} = \partial^2 f / \partial x_i \partial x_j$; задаёт квадратичную часть $f(x + h) \approx f(x) + \nabla f^\top h + \tfrac12 h^\top H h$.'
  lesson: hessian-taylor
  prerequisites: [calc.gradient, la.quadratic-form]
  core: true

- id: calc.stationary-point
  title:
    ru: 'Критическая точка'
    en: 'stationary (critical) point'
  summary: 'Точка, где градиент равен нулю: кандидат в минимум, максимум или седло.'
  lesson: hessian-taylor
  prerequisites: [calc.gradient]
  core: true

- id: calc.convexity
  title:
    ru: 'Выпуклость'
    en: 'convexity'
  summary: 'График лежит не выше хорды; у выпуклой функции любая критическая точка — глобальный минимум.'
  lesson: convexity
  prerequisites: [calc.stationary-point, la.psd]
  core: true

- id: calc.gradient-descent
  title:
    ru: 'Градиентный спуск'
    en: 'gradient descent'
  summary: '$\theta := \theta - \eta \nabla J(\theta)$; на квадратичной функции сходится при $0 < \eta < 2/\lambda_{\max}$, скорость решает число обусловленности.'
  lesson: gradient-descent
  prerequisites: [calc.gradient, calc.convexity, la.eigen]
  core: true

- id: calc.newton
  title:
    ru: 'Метод Ньютона'
    en: 'Newton''s method'
  summary: '$\theta := \theta - H^{-1} \nabla \ell(\theta)$ — шаг к минимуму квадратичного приближения; вблизи минимума число верных знаков удваивается за итерацию.'
  lesson: newton
  prerequisites: [calc.hessian, calc.gradient-descent]
  core: true

- id: calc.lagrange
  title:
    ru: 'Множители Лагранжа'
    en: 'Lagrange multipliers'
  summary: 'Экстремум $f$ при $h(x) = 0$: $\nabla f = \lambda \nabla h$ и само ограничение; в PCA $\lambda$ — собственное значение.'
  lesson: lagrange
  prerequisites: [calc.gradient, calc.convexity, la.eigen]
  core: true

- id: calc.kkt
  title:
    ru: 'Двойственность и условия KKT'
    en: 'duality and KKT conditions'
  summary: 'Для неравенств $g_i(x) \le 0$: стационарность, допустимость, $\alpha_i \ge 0$ и $\alpha_i g_i = 0$; двойственная задача даёт нижнюю оценку $d^\star \le p^\star$.'
  lesson: duality-kkt
  prerequisites: [calc.lagrange, calc.convexity]
  core: false

- id: calc.change-of-variables
  title:
    ru: 'Кратные интегралы и замена переменных'
    en: 'multiple integrals and change of variables'
  summary: 'Кратный интеграл считают как повторный (Фубини); при замене $x = \varphi(u)$ площадь умножается на $\lvert \det J \rvert$; в полярных координатах $dx\,dy = r\,dr\,d\varphi$.'
  lesson: multiple-integrals
  prerequisites: [calc.integral, calc.chain-rule, la.determinant]
  core: true

- id: calc.log-exp
  title:
    ru: 'Логарифм и экспонента'
    en: 'logarithm and exponential'
  summary: '$\log(ab) = \log a + \log b$, $\log e^x = x$; логарифм возрастает, поэтому не меняет точку максимума.'
  lesson: exp-log-sigmoid
  prerequisites: []
  core: true

- id: calc.sigmoid
  title:
    ru: 'Сигмоида'
    en: 'sigmoid, logistic function'
  summary: '$g(z) = \frac{1}{1 + e^{-z}}$ переводит любое число в $(0, 1)$; $1 - g(z) = g(-z)$, $g''(z) = g(z)\bigl(1 - g(z)\bigr)$.'
  lesson: exp-log-sigmoid
  prerequisites: [calc.log-exp]
  core: true

- id: calc.derivative
  title:
    ru: 'Производная'
    en: 'derivative'
  summary: '$f''(x) = \lim_{h \to 0} \frac{f(x + h) - f(x)}{h}$ — скорость изменения $f$; $(x^k)'' = k x^{k-1}$, $(e^x)'' = e^x$, $(\log x)'' = \frac{1}{x}$.'
  lesson: derivative-refresher
  prerequisites: [calc.log-exp]
  core: true

- id: calc.chain-rule
  title:
    ru: 'Правило цепочки'
    en: 'chain rule'
  summary: '$(g \circ f)''(x) = g''\bigl(f(x)\bigr)\, f''(x)$: производная внешней функции во внутренней, умноженная на производную внутренней.'
  lesson: derivative-refresher
  prerequisites: [calc.derivative, nota.sets]
  core: true

- id: calc.integral
  title:
    ru: 'Интеграл'
    en: 'integral'
  summary: '$\int_a^b f(x)\, dx$ — площадь под графиком, предел сумм прямоугольников; $\int_a^b f(x)\, dx = F(b) - F(a)$, где $F'' = f$.'
  lesson: integral
  prerequisites: [calc.derivative, nota.sums]
  core: true

