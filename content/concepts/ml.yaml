# Понятия машинного обучения, на которые ссылаются формулы курса математики («Где используется»).
# Основной граф понятий курсов ML появится вместе с их уроками (docs/program/catalog.md).
- id: ml.least-squares
  title:
    ru: 'Метод наименьших квадратов'
    en: 'least squares'
  summary: 'Веса минимизируют $\tfrac12 \lVert X\theta - y \rVert^2$; решение — нормальные уравнения $X^\top X\theta = X^\top y$, остаток перпендикулярен столбцам $X$.'
  lesson: linear-regression
  prerequisites: [ml.loss, la.projection, calc.matrix-calculus, calc.convexity]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / The normal equations'

- id: ml.linear-regression-probabilistic
  title:
    ru: 'Вероятностная модель линейной регрессии'
    en: 'probabilistic interpretation of linear regression'
  summary: 'При гауссовом шуме максимум правдоподобия совпадает с минимумом суммы квадратов остатков.'
  lesson: linear-regression
  prerequisites: [ml.least-squares, stat.mle, prob.normal]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / Probabilistic interpretation'

- id: ml.ridge
  title:
    ru: 'Гребневая регрессия'
    en: 'ridge regression'
  summary: 'Штраф $\tfrac12 \lambda \lVert \theta \rVert^2$ к сумме квадратов; решение $(X^\top X + \lambda I)^{-1} X^\top y$ существует и при неполном ранге $X$.'
  lesson: regularization
  prerequisites: [la.inverse, la.psd]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Regularization and model selection'

- id: ml.loss
  title:
    ru: 'Функция потерь'
    en: 'loss function'
  summary: 'Число, которое измеряет, насколько модель плоха на данных; у регрессии — половина суммы квадратов ошибок $J = \tfrac12 \sum_i (y^{(i)} - \hat y^{(i)})^2$.'
  lesson: regression-by-hand
  prerequisites: []
  core: true


- id: ml.supervised-learning
  title:
    ru: 'Обучение с учителем'
    en: 'supervised learning'
  summary: 'По парам $(x^{(i)}, y^{(i)})$ подобрать $h_\theta$, которая мало ошибается на новых объектах: потери на обучающей выборке, ошибка — на отложенной; бейзлайн-константа как точка отсчёта.'
  lesson: learning-problem
  prerequisites: [ml.loss, stat.risk-generalization]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Supervised learning'

- id: ml.lms
  title:
    ru: 'Правило LMS и стохастический спуск'
    en: 'LMS rule, stochastic gradient descent'
  summary: 'Градиентный спуск по $J(\theta) = \tfrac{1}{2n}\lVert X\theta - y\rVert^2$: пакетный шаг $\theta \leftarrow \theta - \tfrac{\alpha}{n} X^\top(X\theta - y)$, SGD — по одному объекту, мини-батч — по пакету. Сходимость при $\alpha < 2/\lambda_{\max}$, скорость задаёт число обусловленности; стандартизация признаков выравнивает линии уровня.'
  lesson: linear-regression-lms
  prerequisites: [ml.least-squares, calc.gradient-descent, ml.supervised-learning]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / LMS algorithm'

- id: ml.feature-map
  title:
    ru: 'Признаковое отображение'
    en: 'feature map'
  summary: 'Модель $h_\theta(x) = \theta^\top \phi(x)$ линейна по $\theta$, а не по $x$: степени, логарифмы и произведения признаков обучаются теми же нормальными уравнениями с матрицей $\Phi$ вместо $X$.'
  lesson: features-lwr
  prerequisites: [ml.least-squares, ml.supervised-learning]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression'

- id: ml.lwr
  title:
    ru: 'Локально взвешенная регрессия'
    en: 'locally weighted linear regression'
  summary: 'Для каждой точки запроса — свой взвешенный МНК с весами $w^{(i)} = \exp\bigl(-(x^{(i)} - x)^2/(2\tau^2)\bigr)$: $\theta(x) = (X^\top W X)^{-1} X^\top W y$. Непараметрическая модель: для прогноза хранится вся выборка; ширина окна $\tau$ задаёт гибкость.'
  lesson: features-lwr
  prerequisites: [ml.least-squares, ml.feature-map, stat.risk-generalization]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Linear regression / Locally weighted linear regression'

- id: ml.logistic-regression
  title:
    ru: 'Логистическая регрессия'
    en: 'logistic regression'
  summary: 'Вероятность класса $h_\theta(x) = g(\theta^\top x)$, веса — максимум правдоподобия Бернулли: $\nabla_\theta \ell = X^\top(y - g(X\theta))$, гессиан $-X^\top D X \preceq 0$, поэтому максимум один; метод Ньютона (IRLS) доходит до него за несколько итераций. Граница решений — гиперплоскость $\theta^\top x = 0$.'
  lesson: logistic-regression
  prerequisites: [ml.lms, calc.sigmoid, stat.mle, calc.newton, calc.convexity]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Classification and logistic regression'

- id: ml.perceptron
  title:
    ru: 'Перцептрон'
    en: 'perceptron'
  summary: 'Модель $h_\theta(x) = 1\{\theta^\top x \ge 0\}$ и правило $\theta := \theta + \alpha(y^{(i)} - h_\theta(x^{(i)}))\,x^{(i)}$: поправка только на ошибках. На разделимых данных останавливается за конечное число ошибок, на неразделимых зацикливается; вероятностей не даёт.'
  lesson: perceptron-softmax
  prerequisites: [ml.logistic-regression]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Classification and logistic regression / The perceptron learning algorithm'

- id: ml.softmax
  title:
    ru: 'Softmax-регрессия'
    en: 'softmax (multinomial logistic) regression'
  summary: 'У каждого из $k$ классов свой вектор $\theta_j$; вероятности $p_j(x) = e^{\theta_j^\top x} / \sum_s e^{\theta_s^\top x}$, потери — кросс-энтропия, градиент $\frac1n X^\top(P - Y)$. Параметры определены с точностью до общего сдвига; при $k = 2$ — логистическая регрессия с $\theta_1 - \theta_2$.'
  lesson: perceptron-softmax
  prerequisites: [ml.logistic-regression, prob.information]
  core: true
  cs229:
    - edition: main-notes-2026-spring
      section: 'Classification and logistic regression / Multi-class classification'
