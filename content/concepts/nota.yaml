# Понятия модуля 0 (обозначения и школьная математика). Формат — content/concepts/la.yaml.
- id: nota.sums
  title:
    ru: 'Знак суммы'
    en: 'summation notation'
  summary: 'Сумма $\sum_{i=1}^{n} a_i$ и произведение $\prod_{i=1}^{n} a_i$ по индексу: что меняется от слагаемого к слагаемому, что выносится за знак; двойная сумма $x^\top A y = \sum_i \sum_j x_i A_{ij} y_j$.'
  lesson: sums-products-indicators
  prerequisites: [nota.sets]
  core: true

- id: nota.sets
  title:
    ru: 'Множества и отображения'
    en: 'sets and maps'
  summary: '$x \in A$ — элемент, $A \subset B$ — подмножество, $f\colon A \to B$ — правило, по которому каждому элементу $A$ сопоставлен элемент $B$; $\R^d$ — наборы из $d$ чисел.'
  lesson: language-of-math
  prerequisites: []
  core: true

- id: nota.argmin
  title:
    ru: 'Аргмин и пропорциональность'
    en: 'argmin and proportionality'
  summary: '$\arg\min_x f(x)$ — точка, где достигается минимум, а не сам минимум; $p \propto g$ — равенство с точностью до множителя, не зависящего от переменной.'
  lesson: language-of-math
  prerequisites: [nota.sets]
  core: true

- id: nota.indicator
  title:
    ru: 'Индикатор'
    en: 'indicator function'
  summary: '$1\{A\} = 1$, если условие $A$ верно, и $0$ иначе; $\sum_i 1\{y^{(i)} = k\}$ — число объектов класса $k$.'
  lesson: sums-products-indicators
  prerequisites: [nota.sums]
  core: true
