# Карта готовности (S5.02): уроки математики, нужные каждому курсу ML, — строки «Вход» в docs/program/<курс>/README.md
# (у «Основ ML» — «Нужны уроки математики» в описании персоны). Тест src/lib/progress/readiness.test.ts сверяет списки
# с README. Номера — как в курсе математики, диапазоны через длинное тире.
courses:
  - course: ml-basics
    math: [I.1–I.8, II.1–II.7, III.1–III.7, IV.2–IV.3, IV.6–IV.7, V.1]
    before: 'Курс начинается с входной проверки: она отмечает уроки математики, которые стоит освежить.'
  - course: ml-classic
    math: [III.2, III.11, IV.4, IV.6, I.2, I.10, II.8–II.9★, III.8]
    before: '«Основы ML»: 1.4 (логистическая регрессия), 2.2–2.4 (обобщение).'
  - course: ml-tabular
    math: [III.13, IV.2, IV.7]
    before: '«Основы ML» целиком, особенно 2.1 (метрики), 2.4 (кросс-валидация), 2.5 (утечки).'
  - course: deep-learning
    math: [II.2–II.3, I.3, '0.8']
    before: '«Основы ML»: 1.4–1.5 (логистическая и softmax-регрессия), 2.2–2.3 (обобщение и регуляризация).'
  - course: unsupervised
    math: [I.9–I.11, III.5, III.11–III.13, II.6, II.8]
    before: '«Основы ML»: 1.1, 2.2.'
  - course: rl
    math: [III.9, '0.4', II.6]
    before: '«Основы ML»: 1.1–1.2.'
  - course: llm
    math: [I.2, III.13]
    before: '«Глубокое обучение»: 1.1–2.3, 3.2–3.3.'
