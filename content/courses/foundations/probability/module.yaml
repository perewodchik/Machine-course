# Модуль III. Вероятность. Порядок уроков задаётся здесь, а не именами файлов.
id: probability
number: 'III'
title:
  ru: 'Вероятность'
hours: [26, 30]
lessons:
  - slug: probability-space
    number: 'III.1'
    title: 'Вероятностное пространство'
    requires: [foundations/start/language-of-math, foundations/start/sums-products-indicators]
  - slug: conditional-independence
    number: 'III.2'
    title: 'Условная вероятность и независимость'
    requires: [foundations/probability/probability-space]
    cs229: ['Generative learning algorithms']
  - slug: bayes
    number: 'III.3'
    title: 'Формула полной вероятности и Байес'
    requires: [foundations/probability/conditional-independence]
    cs229: ['Generative learning algorithms']
  - slug: random-variables
    number: 'III.4'
    title: 'Случайные величины: PMF, PDF, CDF'
    requires: [foundations/probability/probability-space, foundations/start/integral]
  - slug: expectation-variance
    number: 'III.5'
    title: 'Матожидание, дисперсия, неравенство Йенсена'
    requires: [foundations/probability/random-variables]
    cs229: ['The EM algorithm']
  - slug: discrete-distributions
    number: 'III.6'
    title: 'Дискретные распределения'
    requires: [foundations/probability/expectation-variance]
    cs229: ['Classification and logistic regression', 'Generative learning algorithms', 'Generalized linear models']
  - slug: continuous-distributions
    number: 'III.7'
    title: 'Непрерывные распределения'
    requires: [foundations/probability/expectation-variance, foundations/start/integral]
    cs229: ['Linear regression', 'Regularization and model selection', 'Independent components analysis']
  - slug: limit-theorems
    number: 'III.8'
    title: 'Предельные теоремы и метод Монте-Карло'
    requires: [foundations/probability/discrete-distributions, foundations/probability/continuous-distributions]
    cs229: ['Generalization']
  - slug: joint-distributions
    number: 'III.9'
    title: 'Совместные распределения и ковариация'
    requires: [foundations/probability/expectation-variance, foundations/probability/limit-theorems]
    cs229: ['Generalization', 'Reinforcement learning']
  - slug: random-vectors
    number: 'III.10'
    title: 'Случайные векторы и линейные преобразования'
    requires: [foundations/probability/joint-distributions, foundations/linear-algebra/quadratic-forms, foundations/calculus/multiple-integrals]
    cs229: ['Principal components analysis', 'Independent components analysis']
  - slug: multivariate-normal
    number: 'III.11'
    title: 'Многомерное нормальное распределение'
    requires: [foundations/probability/random-vectors, foundations/linear-algebra/eigen, foundations/linear-algebra/quadratic-forms]
    cs229: ['Generative learning algorithms', 'The EM algorithm']
  - slug: mixtures-latent
    number: 'III.12'
    title: 'Смеси и скрытые переменные'
    requires: [foundations/probability/multivariate-normal, foundations/probability/bayes]
    cs229: ['The EM algorithm']
  - slug: information
    number: 'III.13'
    title: 'Энтропия, кросс-энтропия, KL'
    requires: [foundations/probability/expectation-variance, foundations/probability/discrete-distributions]
    cs229: ['Classification and logistic regression', 'Deep learning', 'The EM algorithm']
