  - slug: ml-practice
    number: '2.5'
    title: 'Кривые обучения, анализ ошибок и утечки'
    requires: [foundations/statistics/risk-generalization, ml-basics/evaluation/classification-metrics, ml-basics/evaluation/bias-variance, ml-basics/evaluation/regularization, ml-basics/evaluation/model-selection]
    cs229: ['ML advice']
