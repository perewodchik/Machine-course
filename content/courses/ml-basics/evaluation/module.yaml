  - slug: bias-variance
    number: '2.2'
    title: 'Смещение и разброс'
    requires: [foundations/linear-algebra/orthogonality-projections, foundations/probability/expectation-variance, foundations/statistics/estimators, foundations/statistics/risk-generalization, ml-basics/linear-models/learning-problem, ml-basics/linear-models/features-lwr]
