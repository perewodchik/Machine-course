id: f.bayes
kind: formula
title:
  ru: 'Формула Байеса'
  en: "Bayes' rule"
statement: 'P(B_k \mid A) = \frac{P(A \mid B_k)\, P(B_k)}{\sum_{j=1}^{K} P(A \mid B_j)\, P(B_j)}'

# В проверках — таблица совместных вероятностей P (K × 2): строка k — гипотеза B_k, столбец 0 — событие A, 1 — не A.
# Тогда P(A ∩ B_k) = P[k, 0], P(B_k) — сумма строки, P(A) — сумма столбца 0.
symbols:
  - name: P
    tex: 'P'
    meaning: 'таблица совместных вероятностей гипотез $B_k$ и события $A$'
    shape: [k, 2]
    sample: simplex

dependsOn:
  concepts: [prob.conditional, prob.total-probability]
  rules: []

conditions:
  # части в фигурных скобках не рвутся по «=»; перенос — только между ними (\allowbreak)
  - tex: '{B_i \cap B_j = \varnothing \ (i \ne j)},\quad\allowbreak {B_1 \cup \ldots \cup B_K = \Omega}'
    why: 'Гипотезы попарно несовместны и вместе покрывают все исходы: каждый исход $A$ попадает ровно в одну $B_j$ — это нужно для формулы полной вероятности в знаменателе.'
    concept: prob.total-probability
  - tex: 'P(A) > 0'
    why: 'Условная вероятность по событию нулевой вероятности не определена.'
    concept: prob.conditional

derivation:
  plan:
    - 'Записать определение условной вероятности'
    - 'Выразить совместную вероятность через $P(A \mid B_k)$'
    - 'Разложить $P(A)$ по гипотезам'
  steps:
    - goal: 0
      tex: 'P(B_k \mid A) = \frac{P(A \cap B_k)}{P(A)}'
      by: [prob.conditional]
      note: 'Определение условной вероятности.'
      check:
        kind: same
        py: 'P[:, 0] / np.sum(P[:, 0])'
    - goal: 1
      tex: '= \frac{\changed{P(A \mid B_k)\, P(B_k)}}{P(A)}'
      by: [prob.conditional]
      note: 'То же определение для $P(A \mid B_k)$: $P(A \cap B_k) = P(A \mid B_k)\, P(B_k)$.'
      check:
        kind: same
        py: '(P[:, 0] / np.sum(P, axis=1)) * np.sum(P, axis=1) / np.sum(P[:, 0])'
    - goal: 2
      tex: '= \frac{P(A \mid B_k)\, P(B_k)}{\changed{\sum_{j=1}^{K} P(A \mid B_j)\, P(B_j)}}'
      by: [prob.total-probability]
      note: '$A$ разбивается на непересекающиеся части $A \cap B_j$: $P(A) = \sum_j P(A \cap B_j) = \sum_j P(A \mid B_j)\, P(B_j)$.'
      check:
        kind: same
        py: '(P[:, 0] / np.sum(P, axis=1)) * np.sum(P, axis=1) / np.sum((P[:, 0] / np.sum(P, axis=1)) * np.sum(P, axis=1))'

pitfalls:
  - 'Путать $P(A \mid B)$ и $P(B \mid A)$: «тест находит 90 % больных» — это $P(+ \mid \text{болен})$, а не $P(\text{болен} \mid +)$.'
  - 'Игнорировать базовую частоту $P(B_k)$: при редкой болезни большинство положительных тестов — ложные.'

cs229:
  - edition: main-notes-2026-spring
    section: 'Generative learning algorithms'

usedIn: [prob.bayes]
