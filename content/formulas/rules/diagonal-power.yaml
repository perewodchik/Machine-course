id: rule.diagonal-power
kind: rule
title:
  ru: 'Степень диагонализуемой матрицы'
  en: 'power of a diagonalizable matrix'
statement: '(V \Lambda V^{-1})^3 = V \Lambda^3 V^{-1}'
symbols:
  - name: V
    tex: 'V'
    shape: [d, d]
    sample: invertible
  - name: lam
    tex: '\lambda'
    shape: [d, 1]
concept: la.eigen
corollary: 'Внутренние $V^{-1} V$ сокращаются: $A^k = V \Lambda^k V^{-1}$, а $\Lambda^k$ — диагональная матрица из $\lambda_i^k$. Так считают высокие степени и видят, что $A^k v_i = \lambda_i^k v_i$.'
pitfall: 'Возводить в степень и $V$: $V^3 \Lambda^3 V^{-3}$ — это уже другая матрица.'
checks:
  - kind: identity
    lhs: 'np.linalg.matrix_power(V @ np.diag(lam) @ np.linalg.inv(V), 3)'
    rhs: 'V @ np.diag(lam ** 3) @ np.linalg.inv(V)'
mutations:
  - tex: 'V^3 \Lambda^3 V^{-3}'
    py: 'np.linalg.matrix_power(V, 3) @ np.diag(lam ** 3) @ np.linalg.inv(np.linalg.matrix_power(V, 3))'
    why: 'Степень берут только у $\Lambda$: в произведении $(V\Lambda V^{-1})(V\Lambda V^{-1})(V\Lambda V^{-1})$ внутренние $V^{-1}V$ сокращаются, а крайние $V$ и $V^{-1}$ остаются по одному.'
  - tex: 'V (3\Lambda) V^{-1}'
    py: 'V @ np.diag(3 * lam) @ np.linalg.inv(V)'
    why: 'Степень — не умножение на число: на диагонали $\lambda_i^3$, а не $3\lambda_i$.'
