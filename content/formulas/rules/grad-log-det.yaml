id: rule.grad-log-det
kind: rule
title:
  ru: 'Градиент логарифма модуля определителя'
  en: 'gradient of log |det A|'
statement: '\nabla_A \log\lvert\det A\rvert = A^{-\top}'
symbols:
  - name: A
    tex: 'A'
    shape: [d, d]
    sample: invertible
concept: calc.matrix-calculus
pitfall: 'Без модуля формула верна только при det A > 0. Если A ограничена симметричными матрицами, «симметричная» производная другая; CS229 это ограничение игнорирует, и точка минимума от этого не меняется.'
checks:
  - kind: gradient
    f: 'np.log(abs(np.linalg.det(A)))'
    grad: 'np.linalg.inv(A).T'
    wrt: A
# типичные ошибки (S3.05): неверные варианты в задачах с выбором и диагноз ответа ученика
mutations:
  - tex: 'A^{-1}'
    py: 'np.linalg.inv(A)'
    why: 'Без транспонирования: $A^{-1}$ верно только для симметричной $A$, в общем случае $A^{-\top}$.'
  - tex: '\frac{1}{\det A}'
    py: '1 / np.linalg.det(A)'
    why: 'Это производная логарифма по самому $\det A$; нужна ещё производная $\det A$ по $A$, и вместе получается $A^{-\top}$.'
