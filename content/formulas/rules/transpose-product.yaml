id: rule.transpose-product
kind: rule
title:
  ru: 'Транспонирование произведения'
  en: 'transpose of a product'
statement: '(AB)^\top = B^\top A^\top'
symbols:
  - name: A
    tex: 'A'
    shape: [m, k]
  - name: B
    tex: 'B'
    shape: [k, p]
concept: la.transpose
pitfall: 'Порядок множителей меняется: $(AB)^\top \ne A^\top B^\top$. Подсказка — размерности: $A^\top B^\top$ это $(k \times m)(p \times k)$, такое произведение обычно не определено.'
checks:
  - kind: identity
    lhs: '(A @ B).T'
    rhs: 'B.T @ A.T'
# типичные ошибки (S3.05): неверные варианты в задачах с выбором и диагноз ответа ученика
mutations:
  - tex: 'A^\top B^\top'
    py: 'A.T @ B.T'
    why: 'Транспонирование без смены порядка: множители меняются местами, $(AB)^\top = B^\top A^\top$.'
