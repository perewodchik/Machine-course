id: f.sigmoid-derivative
kind: formula
title:
  ru: 'Производная сигмоиды'
  en: 'derivative of the sigmoid'
statement: 'g''(z) = g(z)\bigl(1 - g(z)\bigr)'

symbols:
  - name: z
    tex: 'z'
    meaning: 'аргумент сигмоиды; в логистической регрессии $z = \theta^\top x$'
    shape: []

dependsOn:
  concepts: [calc.sigmoid, calc.log-exp]
  rules: [rule.sigmoid-symmetry]

derivation:
  plan:
    - 'Записать $g$ как степень: $(1 + e^{-z})^{-1}$'
    - 'Продифференцировать по правилу цепочки'
    - 'Разбить дробь на два множителя и узнать в них $g(z)$ и $1 - g(z)$'
  steps:
    - goal: 0
      tex: 'g(z) = \frac{1}{1 + e^{-z}} = (1 + e^{-z})^{-1}'
      by: [calc.sigmoid]
      note: 'Степень с минус первым показателем дифференцировать проще, чем дробь.'
      check:
        kind: same
        py: '1 / (1 + np.exp(-z))'
    - goal: 1
      tex: 'g''(z) = \changed{-(1 + e^{-z})^{-2} \cdot (-e^{-z})}'
      by: [calc.log-exp]
      note: 'Производная $u^{-1}$ — это $-u^{-2}$, умноженное на производную $u = 1 + e^{-z}$, то есть на $-e^{-z}$ (правило цепочки, урок 0.6).'
      check:
        kind: gradient
        wrt: z
        py: '-(1 + np.exp(-z)) ** -2 * (-np.exp(-z))'
    - goal: 2
      tex: '= \changed{\frac{1}{1 + e^{-z}} \cdot \frac{e^{-z}}{1 + e^{-z}}}'
      by: [calc.sigmoid]
      note: 'Минусы сокращаются; квадрат знаменателя делим между двумя дробями.'
      check:
        kind: gradient
        wrt: z
        py: '(1 / (1 + np.exp(-z))) * (np.exp(-z) / (1 + np.exp(-z)))'
    - goal: 2
      tex: '= g(z) \cdot \changed{\bigl(1 - g(z)\bigr)}'
      by: [rule.sigmoid-symmetry]
      note: '$\frac{e^{-z}}{1 + e^{-z}} = \frac{(1 + e^{-z}) - 1}{1 + e^{-z}} = 1 - g(z)$.'
      check:
        kind: gradient
        wrt: z
        py: '(1 / (1 + np.exp(-z))) * (1 - 1 / (1 + np.exp(-z)))'

pitfalls:
  - 'Потерять внутреннюю производную $-e^{-z}$ и получить $g''(z) < 0$: сигмоида возрастает, её производная положительна.'
  - 'Ждать больших градиентов на краях: $g(z)\bigl(1 - g(z)\bigr) \le \tfrac14$, максимум — при $z = 0$, а при больших $\lvert z \rvert$ производная почти ноль.'

cs229:
  - edition: main-notes-2026-spring
    section: 'Classification and logistic regression'

usedIn: [calc.sigmoid]
