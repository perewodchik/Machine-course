# Визуальная регрессия витрины /lab (tests/visual). Эталоны снимаются только здесь — в образе Playwright,
# локальные шрифты и сглаживание дают другие пиксели (docs/implementation/context/testing-ci.md).
# Обновить эталоны: Actions → «Визуальная регрессия» → Run workflow, update = true; скачать артефакт
# visual-baselines, положить в tests/visual/__screenshots__/ и закоммитить с записью в LOG.md.
name: Визуальная регрессия

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Пересоздать эталоны и выложить их артефактом visual-baselines
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "true"
      VISUAL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Сравнение со скриншотами-эталонами
        if: ${{ !inputs.update }}
        run: |
          if [ -d tests/visual/__screenshots__ ]; then
            npx playwright test tests/visual
          else
            echo "::warning::Эталонов нет: запустите workflow с update = true и закоммитьте артефакт visual-baselines"
          fi
      - name: Новые эталоны
        if: ${{ inputs.update }}
        run: npx playwright test tests/visual --update-snapshots=all
      - name: Разница со скриншотами
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 14
      - name: Эталоны
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14
