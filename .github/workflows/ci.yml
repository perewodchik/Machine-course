# Проверки курса: те же команды, что локально (docs/implementation/context/testing-ci.md).
# Визуальная регрессия /lab — отдельный workflow visual.yml (эталоны снимаются в образе Playwright).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Сайт — линтеры, типы, Vitest, валидатор, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pyodide (~16 MB) в git не хранится: npm run build сам вызывает py:fetch, кэш избавляет от скачивания
      - uses: actions/cache@v4
        with:
          path: public/py
          key: pyodide-${{ hashFiles('src/python/version.ts', 'package-lock.json') }}
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm run build

  e2e:
    name: Сайт — Playwright и axe
    runs-on: ubuntu-latest
    # тот же браузер, что у @playwright/test 1.56.1
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Pyodide (~16 MB) в git не хранится: npm run build сам вызывает py:fetch, кэш избавляет от скачивания
      - uses: actions/cache@v4
        with:
          path: public/py
          key: pyodide-${{ hashFiles('src/python/version.ts', 'package-lock.json') }}
      - run: npm run build
      - run: npm run test:e2e
      - name: Отчёт Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  python:
    name: Python — формулы, сниппеты, лабораторные, согласованность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - run: pip install -e "code[dev]"
      - name: Формулы, выводы и сниппеты
        run: pytest
        working-directory: code
      - name: Сборка лабораторных
        run: python scripts/build_notebooks.py --solutions "$RUNNER_TEMP/nb"
      - name: Ученические ноутбуки в репозитории совпадают с исходниками
        run: git diff --exit-code -- notebooks/
      - name: Лабораторные выполняются (с решениями)
        run: pytest --nbmake "$RUNNER_TEMP/nb"
      - name: Согласованность курсов, программы и плана
        run: python scripts/check_consistency.py
